# Redis Slave Configuration
port 6379
bind 0.0.0.0

# Replication
replicaof redis-master 6379
replica-read-only yes
replica-serve-stale-data yes

# Memory Management
maxmemory 1gb
maxmemory-policy allkeys-lru

# Persistence (reduced for slave)
save 900 1
save 300 10
save 60 10000

# Append Only File
appendonly yes
appendfsync everysec

# Performance
tcp-keepalive 300
tcp-backlog 511
timeout 0
databases 16

# Logging
loglevel notice

# Security
protected-mode no

# Client connections
maxclients 10000

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Memory optimization (same as master)
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Threading
io-threads 4
io-threads-do-reads yes
