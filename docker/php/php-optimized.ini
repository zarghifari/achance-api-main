; PHP Optimized Configuration

[PHP]
; Performance Settings
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
post_max_size = 100M
upload_max_filesize = 100M
max_file_uploads = 20

; Security
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Session optimizations
session.save_handler = redis
session.save_path = "tcp://redis-master:6379"
session.gc_maxlifetime = 3600
session.cache_limiter = nocache
session.cookie_httponly = On
session.cookie_secure = Off
session.use_strict_mode = On

; OPcache Configuration (Critical for performance)
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 512
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 50000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 0
opcache.enable_file_override = 1
opcache.optimization_level = 0x7FFFBFFF
opcache.preload = /var/www/config/opcache-preload.php
opcache.preload_user = www-data

; APCu Configuration
[apcu]
apc.enabled = 1
apc.shm_size = 256M
apc.ttl = 3600
apc.enable_cli = 1

; Realpath Cache
realpath_cache_size = 256K
realpath_cache_ttl = 3600

; File handling
default_charset = "UTF-8"
auto_detect_line_endings = Off

; Date
date.timezone = "UTC"

; Logging
log_errors_max_len = 1024
ignore_repeated_errors = On
ignore_repeated_source = On

; MySQL optimizations
[mysql]
mysql.default_port = 3306
mysql.connect_timeout = 60
mysql.default_socket = /var/run/mysqld/mysqld.sock

[mysqli]
mysqli.max_persistent = -1
mysqli.allow_persistent = On
mysqli.max_links = -1
mysqli.default_port = 3306
mysqli.default_socket = /var/run/mysqld/mysqld.sock
mysqli.default_host = mysql
mysqli.default_user = root
mysqli.reconnect = Off

; Redis
[redis]
redis.arrays.autorehash = 1
