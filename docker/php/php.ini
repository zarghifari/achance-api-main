[PHP]
; Performance settings (Optimized for development)
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; OPcache settings for better performance (Development)
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1  ; Enable for development
opcache.revalidate_freq=0  ; Check on every request in development
opcache.fast_shutdown=1
opcache.enable_cli=1
opcache.save_comments=1
opcache.enable_file_override=1
opcache.jit=tracing  ; PHP 8+ JIT compiler
opcache.jit_buffer_size=128M

; Realpath cache settings (Improves file system performance)
realpath_cache_size=4096K
realpath_cache_ttl=7200

; Session settings (Using Redis for better performance)
session.save_handler = redis
session.save_path = "tcp://redis-master:6379?database=2"
session.gc_maxlifetime = 1440

; Error reporting (for development)
display_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /var/www/storage/logs/php_errors.log

; Timezone
date.timezone = UTC

; Additional performance settings
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
max_input_vars = 5000

; PDO MySQL settings for better connection handling
pdo_mysql.cache_size = 2000
pdo_mysql.default_socket=/var/run/mysqld/mysqld.sock
