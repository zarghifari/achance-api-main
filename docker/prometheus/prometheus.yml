# Prometheus Configuration for Achance API Monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PHP-FPM instances
  - job_name: 'php-fpm-app1'
    static_configs:
      - targets: ['app1:9000']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'php-fpm-app2'
    static_configs:
      - targets: ['app2:9000']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'php-fpm-app3'
    static_configs:
      - targets: ['app3:9000']
    metrics_path: /metrics
    scrape_interval: 10s

  # Nginx Load Balancer
  - job_name: 'nginx-lb'
    static_configs:
      - targets: ['nginx-lb:80']
    metrics_path: /nginx_status
    scrape_interval: 10s

  # MySQL Database
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql:3306']
    scrape_interval: 30s

  # Redis Master
  - job_name: 'redis-master'
    static_configs:
      - targets: ['redis-master:6379']
    scrape_interval: 10s

  # Redis Slave
  - job_name: 'redis-slave'
    static_configs:
      - targets: ['redis-slave:6379']
    scrape_interval: 10s

  # Laravel Application Metrics
  - job_name: 'laravel-app'
    static_configs:
      - targets: ['nginx-lb:80']
    metrics_path: /performance/metrics/prometheus
    scrape_interval: 5s
    scrape_timeout: 3s

  # Custom API Endpoints
  - job_name: 'api-health'
    static_configs:
      - targets: ['nginx-lb:80']
    metrics_path: /performance/health
    scrape_interval: 30s

# Remote write for long-term storage (optional)
remote_write:
  - url: "http://victoria-metrics:8428/api/v1/write"
    queue_config:
      max_samples_per_send: 1000
      batch_send_deadline: 5s
