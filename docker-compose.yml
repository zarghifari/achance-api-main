services:
  # Load Balancer (Optimized for performance)
  nginx-lb:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/load-balancer.conf:/etc/nginx/nginx.conf
      - ./src/public:/var/www/public:delegated  # Delegated for better performance on Windows/Mac
      - ./docker/ssl:/etc/nginx/ssl
      - nginx_cache:/var/cache/nginx  # Persistent cache volume
    depends_on:
      - app1
    networks:
      - achance-network
    environment:
      - NGINX_WORKER_PROCESSES=auto
      - NGINX_WORKER_CONNECTIONS=2048

  # Single PHP-FPM App Instance (Simplified for development)
  app1:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    volumes:
      - ./src:/var/www:cached  # Cached mode for better performance on Windows/Mac
      - vendor_app1:/var/www/vendor  # Use Docker volume for vendor (HUGE performance boost on WSL2)
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
      - ./docker/php/www-optimized.conf:/usr/local/etc/php-fpm.d/www.conf
    environment:
      - APP_INSTANCE=1
      - PHP_OPCACHE_ENABLE=1
      - PHP_OPCACHE_MEMORY_CONSUMPTION=256
      - PHP_OPCACHE_MAX_ACCELERATED_FILES=20000
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=1  # Enable for development
      - PHP_OPCACHE_REVALIDATE_FREQ=0  # Check on every request in dev
      - PHP_FPM_PM=dynamic
      - PHP_FPM_PM_MAX_CHILDREN=30
      - PHP_FPM_PM_START_SERVERS=8
      - PHP_FPM_PM_MIN_SPARE_SERVERS=5
      - PHP_FPM_PM_MAX_SPARE_SERVERS=15
      - REDIS_HOST=redis-master
      - REDIS_PORT=6379
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=achance
      - DB_USERNAME=root
      - DB_PASSWORD=root
    networks:
      - achance-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Database with optimizations (Development-friendly)
  mysql:
    image: mysql:9.0
    platform: linux/amd64
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql/
      - ./docker/mysql/mysql.cnf:/etc/mysql/conf.d/mysql.cnf
      - ./docker/mysql/init:/docker-entrypoint-initdb.d  # Auto-initialize DB
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: achance
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    networks:
      - achance-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    command: 
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-flush-method=O_DIRECT
      - --max-connections=500
      - --sort-buffer-size=4M
      - --read-buffer-size=2M
      - --join-buffer-size=4M
      - --thread-cache-size=100
      - --table-open-cache=2000
      - --tmp-table-size=128M
      - --max-heap-table-size=128M
      - --slow-query-log=1
      - --slow-query-log-file=/var/log/mysql/slow.log
      - --long-query-time=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Master (Primary cache)
  redis-master:
    image: redis:8.0-alpine  # Alpine for smaller size
    platform: linux/amd64
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
      - ./docker/redis/redis-master.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    networks:
      - achance-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis-slave:
    image: redis:8.0-alpine
    platform: linux/amd64
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_slave_data:/data
      - ./docker/redis/redis-slave.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - achance-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Remove Elasticsearch for development (optional, enable only if needed)
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
  #   volumes:
  #     - elasticsearch_data:/usr/share/elasticsearch/data
  #   ports:
  #     - "9200:9200"
  #   networks:
  #     - achance-network
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 1G
  #       reservations:
  #         memory: 512M

  # Queue Worker for background processing
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    volumes:
      - ./src:/var/www:cached
    environment:
      - REDIS_HOST=redis-master
      - REDIS_PORT=6379
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=achance
      - DB_USERNAME=root
      - DB_PASSWORD=root
    command: php artisan queue:work --daemon --sleep=3 --tries=3 --max-time=3600
    depends_on:
      redis-master:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - achance-network
    deploy:
      replicas: 1  # Reduced to 1 for development
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Monitoring (Optional for development - comment out if not needed)
  # prometheus:
  #   image: prom/prometheus:latest
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - prometheus_data:/prometheus
  #   networks:
  #     - achance-network
  # 
  # grafana:
  #   image: grafana/grafana:latest
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - grafana_data:/var/lib/grafana
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #   networks:
  #     - achance-network

  phpmyadmin:
    image: phpmyadmin:5.2.2
    restart: always
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=root
      - PMA_PASSWORD=root
    depends_on:
      - mysql
    networks:
      - achance-network

volumes:
  db_data:
  redis_master_data:
  redis_slave_data:
  nginx_cache:
  vendor_app1:  # Vendor directory volume for app1 (CRITICAL for WSL2 performance)
  # elasticsearch_data:  # Commented out for development
  # prometheus_data:  # Commented out for development
  # grafana_data:  # Commented out for development

networks:
  achance-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
